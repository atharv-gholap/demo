name:  TASK-4 Upload and Download

on:  
  push:
    branches:
      - main


jobs:

   upload-job:
     runs-on:  ubuntu-latest

     steps:
       - name:  downloading file
         uses:  actions/checkout@v4
       - name:  uploading file
         uses:  actions/upload-artifact@v4
         with:
           name:  html-file
           path:  index.html

         
   download-job:
     runs-on:  ubuntu-latest
     
     steps:
       - name:  downloading artifact
         uses:  actions/download-artifact@v4
         with:  
           name:  html-file

       - name:  listing file
         run:  ls -la
