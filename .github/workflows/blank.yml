name: s3
on: 
  push:
    branches: [ "main" ]
jobs: 
  ci-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: to copy the code to the workflow from github repo
        uses:  actions/checkout@v4

      - name: verify files
        run: |
          echo "list the files"
          ls

      - name: validate index.html exit or not
        run: |
          if [ ! -f index.html ]; then echo "index.html not available"
            exit 1
          fi
      - name: uploading index.html as artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: websit-file
          path:  |
            index.html

  deployment:
    needs: ci-jobs
    runs-on: ubuntu-latest

    steps: 
      - name: download artifacts
        uses: actions/download-artifact@v4
        with: 
          name: website-file

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{  secrets.AWS_ACCESS_KEY  }}
          aws-secret-access-key: ${{  secrets.SECRET_ACCESS_KEY  }}


      - name: deploy files to s3 bucket
        uses: aws s3 sync . s3://actions-demo-1
      






          
      
