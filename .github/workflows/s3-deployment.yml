name: CI-CD Pipeline

on:  
  # triggers the workflow on push or pull request
  push:
    branches: [ "main" ]

jobs:
  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name:  copy code to github hosted runner
        uses:  actions/checkout@v4

      - name:  verify files
        run:  |
          echo  "list the files"
          ls

      - name:  validate index.html exist or not
        run:  |
          if [ ! -f index.html ]; then echo "index.html not available"
            exit 1
          fi

      - name:  uploading index.html as artifacts
        uses:  actions/upload-artifact@v4
        with:
          name:  website-file
          path:  |
            index.html

  deployment:
    needs:  ci-job
    runs-on:  ubuntu-latest

    steps:  
      - name:  Download artifacts
        uses:  actions/download-artifact@v4
        with:
          name:  website-file

      - name:  configure AWS credentials
        uses:  aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:  ${{  secrets.AWS_ACCESS_KEY  }}
          aws-secret-access-key:  ${{  secrets.SECRET_ACCESS_KEY  }}
          aws-region:  ${{  secrets.REGION}}

      - name:  deploy files to s3 bucket
        run:  aws s3 sync  . s3://actions-demo-87.40







          
